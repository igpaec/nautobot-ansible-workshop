query ($device_name: [String]) {
  devices(name: $device_name) {
    id
    name
    role { name }
    location { name }
    platform { name network_driver }
    primary_ip4 { address }
    config_context
    interfaces {
      name
      description
      enabled
      mode
      # Used by full_config.j2 to refuse to render config for the out-of-band
      # port. See the guard there — this field is why Lab 4's apply is safe.
      mgmt_only
      ip_addresses { address }
      untagged_vlan { vid name }
      tagged_vlans { vid name }
    }
  }
}
