[defaults]
# cEOS nodes are rebuilt constantly in a lab; host key churn is noise here.
# Do NOT carry this setting into anything resembling production.
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = False

[persistent_connection]
# network_cli against cEOS can be slow to establish on first connect,
# especially on a laptop running the devices alongside Kubernetes.
command_timeout = 60
connect_timeout = 60

[paramiko_connection]
# REQUIRED for password auth against cEOS.
#
# Without look_for_keys = False, the client offers every key in ~/.ssh and in
# ssh-agent BEFORE trying the password. Each offer counts against the device's
# MaxAuthTries (OpenSSH default 6), so with a few keys loaded you get:
#
#   Failed to authenticate public key: Received SSH_MSG_DISCONNECT:
#   2:Too many authentication failures
#
# ...which looks like a wrong password but isn't — password auth was never
# reached. Note that `-k` only supplies the password; it does not stop keys
# being offered.
#
# NOTE: `[ssh_connection] ssh_args` does NOT help here. network_cli uses
# paramiko/libssh, not OpenSSH, so those -o flags are ignored.
look_for_keys = False
host_key_auto_add = True
