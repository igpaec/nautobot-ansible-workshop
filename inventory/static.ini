; Stage 0 — the static inventory that Lab 1 replaces with the Nautobot
; dynamic inventory plugin. The whole point of the cold open is that this file
; is hand-maintained and already stale the moment a device changes.
;
; ansible_host values are the mgmt-ipv4 addresses PINNED in clab/workshop.clab.yml.
; They are no longer "adjust to match your topology" — the topology pins them,
; every attendee lab prints them as literals, and the Nautobot seed data uses
; the same values. If these three ever disagree, Lab 0 or Lab 1 breaks.
;
; Corrected 2026-08-26: these were .3 and .2, captured from an unpinned run
; where ContainerLab assigned addresses in start order and reversed the nodes.

[leaf]
leaf1 ansible_host=172.20.20.11
leaf2 ansible_host=172.20.20.12

[leaf:vars]
ansible_network_os=arista.eos.eos
ansible_connection=ansible.netcommon.network_cli
ansible_become=yes
ansible_become_method=enable

; Force paramiko rather than libssh. Newer ansible.netcommon prefers libssh
; when ansible-pylibssh is installed, and libssh does not honor the
; [paramiko_connection] look_for_keys setting in ansible.cfg that stops
; "Too many authentication failures". Pinning paramiko makes that fix apply.
; Drop this line if you would rather use libssh and can disable key offering
; another way.
ansible_network_cli_ssh_type=paramiko
