---
# Stage 0 — group_vars for the `leaf` group.
#
# IMPORTANT: this file lives beside the inventory file (inventory/group_vars/),
# NOT at the repo root. Ansible resolves group_vars relative to the inventory
# file's directory or the playbook's directory. At the repo root it would be
# silently ignored, which looks exactly like "my variables aren't applying."
#
# Lab 2 deletes this file and serves the same data from Nautobot Config
# Contexts instead. Keep the key names identical so the template doesn't change.

ntp_servers:
  - 10.0.0.1
  - 10.0.0.2

dns_servers:
  - 10.0.0.53

snmp_community: public
mgmt_vrf: MGMT
syslog_host: 10.0.0.10
